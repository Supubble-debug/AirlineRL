# ITSM episode and model budgets, v1 (step 6). Pending user acceptance; once
# accepted this is the frozen protocol, and any change needs a stated reason and
# a new acceptance.
#
# Basis: docs/itsm_step6/token_measurements.json (pinned Qwen3-8B tokenizer,
# scripted gold replays of train/dev only, CPU). Those replays measure the
# environment side and gold tool-call lengths, not real policy outputs; user
# turns were placeholders. Items marked "pending_step7"/"pending_step9" must be
# checked with real runs before they are relied on.

version: itsm_budget_v1

# Measurement basis per task set. Split v2 (step 6C) adds three
# EnterpriseOps-Gym-derived train tasks whose seeds are NOT org-sliced. Re-measured
# on its 45 train/dev tasks: every gold-replay maximum (prompt, response, full
# sequence, tool call, observation, steps) is unchanged, so no value in this file
# changes. Unfiltered reads did change: on the derived MSP task the whole 20-org
# seed is loaded, and three no-argument reads each exceed max_response_length on
# their own (listed below). Under the full-observation rule such a call ends the
# episode with truncate("response_length"). Whether to keep this as is is open
# for the step 6C acceptance (docs/itsm_step6c/README.md); nothing here is
# declared verified.
basis:
  itsm_split_v1:
    measurements: docs/itsm_step6/token_measurements.json
  itsm_split_v2:
    measurements: docs/itsm_step6c/token_measurements_v2.json
    status: pending_step6c_acceptance
    values_changed: false
    # Raw tokens of one call with no arguments (largest per tool), above 12288.
    unfiltered_reads_over_max_response_length:
      - {tool: list_incidents, task_id: itsmbench_eops_1d219d93_d1ba6c2d, raw_tokens: 30041}
      - {tool: get_incidents_assigned_to, task_id: itsmbench_eops_1d219d93_d1ba6c2d, raw_tokens: 30041}
      - {tool: list_users, task_id: itsmbench_eops_1d219d93_d1ba6c2d, raw_tokens: 15137}
tokenizer:
  repo: Qwen/Qwen3-8B
  revision: b968826d9c46dd6066d109eabc6255188de91218
  chat_template_sha256: a55ee1b1660128b7098723e0abcd92caa0788061051c62d51cbe87d9cf1974d8
  enable_thinking: false
  tool_schema_serialization: template_default  # compact variants measured only (schema_serialization.json)

context:
  # Qwen3-8B is trained for a 32768-token native context. config.json declares
  # max_position_embeddings 40960 without rope scaling; 40960 is a CANDIDATE
  # whose quality, generation and memory are unverified. No RoPE/YaRN setting
  # is added or changed. Measured: initial prompt 28104 leaves 4664 tokens at
  # 32768, below the largest gold-replay response (5764).
  native_context: 32768
  max_model_len_candidate: 40960
  status: candidate_pending
  verify:
    step7: single-concurrency, bounded-generation run of real prompt lengths and inference memory
    step9: training memory at the chosen length

# Tool results enter the context in full (no per-observation cut). When the
# next observation or action does not fit, the loop ends the episode with
# truncate("response_length"); the env trace keeps the full observation for
# diagnosis. token_measurements.json applies the same rule.
observation_rule: full_tool_results_no_truncation

# Applies unchanged to every training experiment (E1-E5).
train:
  max_model_len: 40960  # candidate, see context
  # Initial prompt is 28104 tokens (policy 7794 + 94 tool schemas 20051 +
  # instructions/template + greeting and a short first user turn); the rest of
  # 28672 (568 tokens) is headroom for a longer real first user turn.
  max_prompt_length: 28672
  # 40960 - 28672. Gold-replay response: median 2513, p90 3241, max 5764 (2.1x
  # headroom on the longest, for recoveries, extra user turns and messages).
  max_response_length: 12288
  # Per action. Gold tool calls: median 32, p90 63, max 127 (send_notification).
  # 4x the longest gold call, to cover user-facing messages, which were not
  # measured (placeholders). Not the airline 256. pending_step7: truncation rate.
  max_action_tokens: 512
  # Orchestrator steps (user replies + executed tool calls). Gold replay: max 18
  # with 2 placeholder user turns; gold tool calls max 16. Allows ~8 real user
  # turns plus error recovery: (16 + 8) * ~1.7.
  max_steps: 40
  # No separate cap: every non-terminal action consumes a step, so
  # agent_turns <= max_steps by construction (reported, not enforced).
  max_agent_turns: null
  context_rotation: false  # decision D3
  observation_rule: full_tool_results_no_truncation
  text_match: fuzzy  # decision D1b
  user_llm: deepseek/deepseek-v4-flash  # decision D5
  user_llm_temperature: 0.0
  # No checkpoint is chosen by dev score (dev is 12/13 one workflow) or by
  # held-out. The number of optimisation steps and the checkpoint rule are fixed
  # in advance, at the latest in step 8.
  checkpoint_selection: pre_registered_steps_and_rule_frozen_by_step8
  worker:
    # Local CPU (WSL2): tool call <= 0.9 ms, env build/reset <= 112 ms, fuzzy
    # DB scoring <= 26 ms. The user-simulator HTTP call dominates and is
    # unmeasured (no real LLM call in this step).
    user_llm_timeout_s: 60  # pending_step7
    call_timeout_s: 90  # one user call + margin; pending_step7
    episode_timeout_s: 1800  # 40 steps; pending_step7
    max_scoring_retries: 3  # protocol §12: 4 attempts in total

# Applies unchanged to every evaluated model (E0-E5); same episode budget as
# train so DB rewards mean the same thing in training and evaluation.
eval:
  max_model_len: 40960
  max_prompt_length: 28672
  max_response_length: 12288
  max_action_tokens: 512
  max_steps: 40
  max_agent_turns: null
  context_rotation: false
  observation_rule: full_tool_results_no_truncation
  db_text_match: [fuzzy, llm]  # llm judge = deepseek/deepseek-v4-pro, decision D7
  nl_judge: deepseek/deepseek-v4-pro  # decision D7
  user_llm: deepseek/deepseek-v4-flash
  user_llm_temperature: 0.0
  worker:
    user_llm_timeout_s: 60
    call_timeout_s: 90
    episode_timeout_s: 1800
    max_scoring_retries: 3
